name: Check sites and deploy

on:
  schedule:
    - cron: "41 6 * * *"
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      collect:
        description: Collect new posts before checking
        type: boolean
        default: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      # Pushes only redeploy the site; the daily run (or a manual one) collects posts and checks every site.
      - name: Collect posts and check sites
        id: track
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 35
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 -B scripts/track.py ${{ github.event_name == 'workflow_dispatch' && !inputs.collect && '--no-collect' || '' }}
      - name: Commit results
        if: steps.track.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || (git commit -m "Daily site check $(date -u +%F)" && git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main)
      - name: Report a failed check
        if: steps.track.outcome == 'failure'
        run: echo "::warning::Collection or checks failed; deploying the last committed data."
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
